<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《程序设计基础（C#）》知识图谱</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0E110D;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;height:100vh}

/* 顶部标题栏 */
.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(14,17,13,0.95);border-bottom:1px solid #2a3a2a;display:flex;align-items:center;padding:0 20px;z-index:100;backdrop-filter:blur(12px)}
.topbar h1{font-size:17px;color:#7FC873;font-weight:600}
.topbar .subtitle{font-size:12px;color:#888;margin-left:12px}
.topbar .controls{margin-left:auto;display:flex;gap:8px}
.topbar button{background:rgba(127,200,115,0.1);border:1px solid #3a5a3a;color:#7FC873;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;transition:all .2s}
.topbar button:hover{background:rgba(127,200,115,0.2);border-color:#5BA84E}
.topbar button.active{background:rgba(127,200,115,0.3);border-color:#7FC873}

/* 侧边面板 */
.sidepanel{position:fixed;top:56px;right:0;bottom:0;width:340px;background:rgba(18,22,18,0.97);border-left:1px solid #2a3a2a;padding:20px;overflow-y:auto;z-index:50;transform:translateX(100%);transition:transform .3s ease}
.sidepanel.open{transform:translateX(0)}
.sidepanel h2{color:#7FC873;font-size:15px;margin-bottom:8px;border-bottom:1px solid #2a3a2a;padding-bottom:6px}
.sidepanel .node-info{margin-bottom:16px}
.sidepanel .node-info .label{font-size:11px;color:#888;text-transform:uppercase;margin-bottom:3px}
.sidepanel .node-info .value{font-size:13px;color:#c0d0c0;margin-bottom:10px;line-height:1.6}
.sidepanel .prereq-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.sidepanel .prereq-list .chip{background:rgba(127,200,115,0.15);border:1px solid #3a5a3a;color:#7FC873;padding:3px 10px;border-radius:12px;font-size:11px;cursor:pointer;transition:all .15s}
.sidepanel .prereq-list .chip:hover{background:rgba(127,200,115,0.3)}
.sidepanel .concept-list .concept{background:rgba(200,200,200,0.05);border-left:3px solid #5BA84E;padding:6px 10px;margin-bottom:4px;font-size:12px;color:#b0c0b0;border-radius:0 4px 4px 0}

/* 图谱容器 */
#graph-container{position:fixed;top:56px;left:0;right:0;bottom:0;cursor:grab}
#graph-container.dragging{cursor:grabbing}

/* SVG 样式 */
svg{width:100%;height:100%}
.node-circle{cursor:pointer;transition:all .2s ease}
.node-circle:hover{filter:brightness(1.3)}
.node-label{font-size:12px;fill:#e0e0e0;pointer-events:none;text-anchor:middle;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,0.8)}
.node-label.sub{font-size:10px;fill:#999}
.edge-line{stroke:#2a4a2a;stroke-width:1.5;fill:none;opacity:0.4;transition:all .2s}
.edge-line.highlight{stroke:#7FC873;opacity:0.8;stroke-width:2.5}
.edge-line.prereq{stroke-dasharray:4,3}
.edge-line.dependency{stroke-dasharray:none}

/* 模块颜色 */
.mod-foundation{fill:#1a3a5a;stroke:#3a6a9a}
.mod-syntax{fill:#1a4a2a;stroke:#3a8a5a}
.mod-oop{fill:#3a2a4a;stroke:#7a5a9a}
.mod-advanced{fill:#4a3a1a;stroke:#9a7a3a}
.mod-gui{fill:#3a1a2a;stroke:#9a3a6a}
.mod-project{fill:#1a1a3a;stroke:#5a5a9a}

/* 图例 */
.legend{position:fixed;bottom:16px;left:16px;background:rgba(18,22,18,0.9);border:1px solid #2a3a2a;border-radius:8px;padding:12px 14px;z-index:40;font-size:11px}
.legend .title{color:#7FC873;font-weight:600;margin-bottom:8px;font-size:12px}
.legend .item{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.legend .dot{width:12px;height:12px;border-radius:50%;border-width:2px;border-style:solid}

/* 搜索框 */
.search-box{position:fixed;top:68px;left:16px;z-index:40}
.search-box input{background:rgba(18,22,18,0.9);border:1px solid #2a3a2a;border-radius:8px;padding:8px 12px;color:#e0e0e0;font-size:13px;width:200px;outline:none}
.search-box input:focus{border-color:#5BA84E}
.search-box input::placeholder{color:#666}

/* 缩放控制 */
.zoom-controls{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:4px;z-index:40}
.zoom-controls button{width:36px;height:36px;background:rgba(18,22,18,0.9);border:1px solid #2a3a2a;border-radius:6px;color:#7FC873;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.zoom-controls button:hover{background:rgba(127,200,115,0.15)}

/* 工具提示 */
.tooltip{position:fixed;background:rgba(14,17,13,0.95);border:1px solid #3a5a3a;border-radius:8px;padding:10px 14px;font-size:12px;color:#c0d0c0;pointer-events:none;z-index:200;display:none;max-width:280px;backdrop-filter:blur(8px)}
.tooltip.show{display:block}
.tooltip .tt-title{color:#7FC873;font-weight:600;margin-bottom:4px}
.tooltip .tt-meta{color:#888;font-size:11px}

/* 响应式 */
@media(max-width:768px){
  .sidepanel{width:100%}
  .topbar .subtitle{display:none}
  .legend{display:none}
}
</style>
</head>

<script>

const COURSE_DATA = {

    {id:'c1', label:'课件1', sublabel:'认识C#与课程介绍', module:'foundation',

     prereq:[], depend:['c2','c3']},

    {id:'c2', label:'课件2', sublabel:'开发环境与AI辅助编程', module:'foundation',
     concepts:['.NET SDK','VS Code','C#扩展','dotnet命令','AI辅助编程','编译运行'],

    // 模块2: 语法基础
    {id:'c3', label:'课件3', sublabel:'变量与基本数据类型', module:'syntax',
     concepts:['变量','标识符','关键字','整数类型','浮点类型','bool','char','string','var','常量','作用域','Console输入输出','命名规范'],

    {id:'c4', label:'课件4', sublabel:'运算符与表达式', module:'syntax',
     concepts:['算术运算符','自增自减','赋值运算符','关系运算符','逻辑运算符','位运算符','三元运算符','运算符优先级','短路特性'],
     desc:'各类运算符详解，表达式求值规则，运算符优先级',
     prereq:['c3'], depend:['c5','c6']},

    {id:'c5', label:'课件5', sublabel:'类型转换', module:'syntax',

     desc:'OOP核心——继承、多态、抽象类、virtual/override、is/as',

     concepts:['File类','StreamReader','StreamWriter','try-catch异常处理','文件读写'],
     desc:'文件I/O——File类读写，StreamReader/Writer，异常处理try-catch',

     desc:'综合实战——图书管理系统，整合类/集合/文件/异常全栈知识',
     prereq:['c15','c16','c17'], depend:['c21']},

    {id:'c19', label:'课件19', sublabel:'Avalonia跨平台窗体入门', module:'gui',
     concepts:['跨平台','Avalonia','XAML','TextBlock','TextBox','Button','StackPanel','Grid','DockPanel','WrapPanel','Canvas','事件处理','控件属性'],
     desc:'GUI入门——Avalonia跨平台框架，XAML布局，控件与事件',
     prereq:['c2','c11'], depend:['c20','c21']},

    {id:'c20', label:'课件20', sublabel:'Avalonia控件进阶', module:'gui',
     concepts:['CheckBox','RadioButton','ComboBox','ListBox','Slider','ProgressBar','Image','ContextMenu','数据绑定初探'],
     desc:'GUI进阶——更多控件，交互逻辑，点餐系统综合练习',
     prereq:['c19'], depend:['c21']},

    // 模块6: 项目实战
    {id:'c21', label:'课件21', sublabel:'期末大作业', module:'project',
     concepts:['自选主题','管理系统','类+集合+文件IO','Avalonia界面','事件','三层架构','提交要求','评分标准'],
     desc:'期末大作业——自选主题管理系统，综合运用全部所学',
     prereq:['c18','c19','c20'], depend:[]},
  ],

  edges: [
    // 直接前置依赖（实线）
    {from:'c1', to:'c2', type:'prereq'},
    {from:'c2', to:'c3', type:'prereq'},
    {from:'c3', to:'c4', type:'prereq'},
    {from:'c3', to:'c5', type:'prereq'},
    {from:'c3', to:'c6', type:'prereq'},
    {from:'c3', to:'c8', type:'prereq'},
    {from:'c3', to:'c11', type:'prereq'},
    {from:'c4', to:'c5', type:'prereq'},
    {from:'c4', to:'c6', type:'prereq'},
    {from:'c5', to:'c17', type:'prereq'},
    {from:'c6', to:'c7', type:'prereq'},
    {from:'c7', to:'c8', type:'prereq'},

    {from:'c7', to:'c16', type:'prereq'},
    {from:'c8', to:'c9', type:'prereq'},
    {from:'c8', to:'c17', type:'prereq'},
    {from:'c9', to:'c10', type:'prereq'},
    {from:'c9', to:'c14', type:'prereq'},
    {from:'c10', to:'c16', type:'prereq'},
    {from:'c10', to:'c17', type:'prereq'},
    {from:'c10', to:'c20', type:'prereq'},
    {from:'c11', to:'c12', type:'prereq'},
    {from:'c11', to:'c13', type:'prereq'},
    {from:'c11', to:'c14', type:'prereq'},
    {from:'c11', to:'c19', type:'prereq'},

// ===== 模块配置 =====
const MODULES = {
  foundation: {name:'基础入门', color:'#1a3a5a', stroke:'#3a6a9a', cssClass:'mod-foundation'},
  syntax:     {name:'语法基础', color:'#1a4a2a', stroke:'#3a8a5a', cssClass:'mod-syntax'},
  oop:        {name:'面向对象', color:'#3a2a4a', stroke:'#7a5a9a', cssClass:'mod-oop'},
  advanced:   {name:'进阶应用', color:'#4a3a1a', stroke:'#9a7a3a', cssClass:'mod-advanced'},
  gui:        {name:'GUI开发', color:'#3a1a2a', stroke:'#9a3a6a', cssClass:'mod-gui'},
  project:    {name:'项目实战', color:'#1a1a3a', stroke:'#5a5a9a', cssClass:'mod-project'},
};

// ===== 布局算法：分层环形布局 =====
// 按模块分层，每个模块一个弧段
const LAYOUT = {
  // 中心点
  cx: 0, cy: 0,
  // 各节点位置（相对中心）
  positions: {}
};

// 计算节点位置——按模块分组，时间线排列
function computeLayout() {
  const moduleOrder = ['foundation','syntax','oop','advanced','gui','project'];
  const nodesByModule = {};
  COURSE_DATA.nodes.forEach(n => {
    if(!nodesByModule[n.module]) nodesByModule[n.module] = [];
    nodesByModule[n.module].push(n);
  });

  // 螺旋时间线布局
  const centerX = 600, centerY = 400;
  const allNodes = moduleOrder.flatMap(m => nodesByModule[m] || []);
  const n = allNodes.length;

  allNodes.forEach((node, i) => {
    const angle = (i / n) * Math.PI * 2.5 - Math.PI/2; // 2.5圈螺旋
    const radius = 180 + (i / n) * 220; // 逐渐外扩
    LAYOUT.positions[node.id] = {
      x: centerX + Math.cos(angle) * radius,
      y: centerY + Math.sin(angle) * radius * 0.75 // 椭圆
    };
  });
}

// ===== SVG 渲染 =====
let svg, gMain, gEdges, gNodes;
let viewBox = {x: 0, y: 0, w: 1200, h: 800};
let showLabels = true;
let showEdges = true;
let selectedNode = null;

function initSVG() {
  const container = document.getElementById('graph-container');
  container.innerHTML = '';

  svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');

  // 定义箭头
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML = `
    <marker id="arrow-prereq" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3a6a3a" opacity="0.6"/>
    </marker>
    <marker id="arrow-relate" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5a5a5a" opacity="0.4"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  `;
  svg.appendChild(defs);

  gMain = document.createElementNS('http://www.w3.org/2000/svg','g');
  gEdges = document.createElementNS('http://www.w3.org/2000/svg','g');
  gEdges.setAttribute('id','edges-layer');
  gNodes = document.createElementNS('http://www.w3.org/2000/svg','g');
  gNodes.setAttribute('id','nodes-layer');
  gMain.appendChild(gEdges);
  gMain.appendChild(gNodes);
  svg.appendChild(gMain);
  container.appendChild(svg);

  // 点击空白取消选中
  svg.addEventListener('click', (e) => {
    if(e.target === svg) {
      selectedNode = null;
      document.querySelectorAll('.node-halo').forEach(h => h.setAttribute('opacity','0'));
      unhighlightEdges();
      document.getElementById('sidepanel').classList.remove('open');
    }
  });

  renderEdges();
  renderNodes();
}

function renderEdges() {
  gEdges.innerHTML = '';
  if(!showEdges) return;

  COURSE_DATA.edges.forEach(edge => {
    const from = LAYOUT.positions[edge.from];
    const to = LAYOUT.positions[edge.to];
    if(!from || !to) return;

    // 贝塞尔曲线
    const dx = to.x - from.x;
    const dy = to.y - from.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const midX = (from.x + to.x) / 2;
    const midY = (from.y + to.y) / 2;
    // 垂直偏移让弧线更自然
    const offset = dist * 0.12;
    const nx = -dy / dist;
    const ny = dx / dist;

    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', `M${from.x},${from.y} Q${midX + nx*offset},${midY + ny*offset} ${to.x},${to.y}`);
    path.setAttribute('class', `edge-line ${edge.type === 'prereq' ? 'prereq' : 'dependency'}`);

    if(edge.type === 'prereq') {
      path.setAttribute('marker-end','url(#arrow-prereq)');
    } else {
      path.setAttribute('marker-end','url(#arrow-relate)');
      path.style.strokeDasharray = '2,4';
      path.style.opacity = '0.25';
    }

    path.dataset.from = edge.from;
    path.dataset.to = edge.to;
    gEdges.appendChild(path);
  });
}

function renderNodes() {
  gNodes.innerHTML = '';

  COURSE_DATA.nodes.forEach(node => {
    const pos = LAYOUT.positions[node.id];
    if(!pos) return;

    const mod = MODULES[node.module];

    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('transform', `translate(${pos.x},${pos.y})`);
    g.dataset.nodeId = node.id;

    // 外圈光晕（选中时显示）
    const halo = document.createElementNS('http://www.w3.org/2000/svg','circle');
    halo.setAttribute('r','28');
    halo.setAttribute('fill','none');
    halo.setAttribute('stroke', mod.stroke);
    halo.setAttribute('stroke-width','2');
    halo.setAttribute('opacity','0');
    halo.setAttribute('class','node-halo');
    g.appendChild(halo);

    // 节点圆
    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('r','20');
    circle.setAttribute('class', `node-circle ${mod.cssClass}`);
    circle.setAttribute('stroke-width','2');
    g.appendChild(circle);

    // 节点编号
    const numText = document.createElementNS('http://www.w3.org/2000/svg','text');
    numText.setAttribute('text-anchor','middle');
    numText.setAttribute('dy','5');
    numText.setAttribute('fill','#fff');
    numText.setAttribute('font-size','13');
    numText.setAttribute('font-weight','bold');
    numText.setAttribute('pointer-events','none');
    numText.textContent = node.label.replace('课件','');
    g.appendChild(numText);

    // 标签
    if(showLabels) {
      const label = document.createElementNS('http://www.w3.org/2000/svg','text');
      label.setAttribute('class','node-label');
      label.setAttribute('dy','36');
      label.textContent = node.sublabel.length > 10 ? node.sublabel.substring(0,9)+'…' : node.sublabel;
      g.appendChild(label);

      const subLabel = document.createElementNS('http://www.w3.org/2000/svg','text');
      subLabel.setAttribute('class','node-label sub');
      subLabel.setAttribute('dy','50');
      subLabel.textContent = node.label;
      g.appendChild(subLabel);
    }

    // 事件
    g.style.cursor = 'pointer';
    g.addEventListener('click', (e) => {
      e.stopPropagation();
      selectNode(node.id);
    });

    g.addEventListener('mouseenter', (e) => {
      showTooltip(e, node);
      highlightEdges(node.id);
    });

    g.addEventListener('mouseleave', () => {
      hideTooltip();
      unhighlightEdges();
    });

    gNodes.appendChild(g);
  });
}

// ===== 交互逻辑 =====

function selectNode(nodeId) {
  selectedNode = nodeId;
  const node = COURSE_DATA.nodes.find(n => n.id === nodeId);
  if(!node) return;

  // 高亮节点
  document.querySelectorAll('.node-halo').forEach(h => h.setAttribute('opacity','0'));
  const g = gNodes.querySelector(`[data-node-id="${nodeId}"]`);
  if(g) {
    const halo = g.querySelector('.node-halo');
    if(halo) {
      halo.setAttribute('opacity','0.6');
      halo.setAttribute('r','30');
    }
  }

  // 显示侧边面板
  const panel = document.getElementById('sidepanel');
  const content = document.getElementById('panelContent');
  panel.classList.add('open');

  const mod = MODULES[node.module];
  const prereqNodes = node.prereq.map(pid => COURSE_DATA.nodes.find(n => n.id === pid)).filter(Boolean);
  const dependNodes = node.depend.map(did => COURSE_DATA.nodes.find(n => n.id === did)).filter(Boolean);

  let html = `
    <div class="node-info">
      <h2>${node.label} · ${node.sublabel}</h2>
      <div class="label">所属模块</div>
      <div class="value" style="color:${mod.stroke}">● ${mod.name}</div>
      <div class="label">简介</div>
      <div class="value">${node.desc}</div>
  `;

  if(prereqNodes.length > 0) {
    html += `
      <div class="label">前置课件（必须先学）</div>
      <div class="prereq-list">
        ${prereqNodes.map(p => `<span class="chip" onclick="selectNode('${p.id}')">${p.label} ${p.sublabel}</span>`).join('')}
      </div>
    `;
  }

  if(dependNodes.length > 0) {
    html += `
      <div class="label">后续课件（依赖本课）</div>
      <div class="prereq-list">
        ${dependNodes.map(d => `<span class="chip" onclick="selectNode('${d.id}')" style="border-color:#9a7a3a;background:rgba(154,122,58,0.15);color:#9a7a3a">${d.label} ${d.sublabel}</span>`).join('')}
      </div>
    `;
  }

  html += `
    <div class="label">知识点（${node.concepts.length}个）</div>
    <div class="concept-list">
      ${node.concepts.map(c => `<div class="concept">${c}</div>`).join('')}
    </div>
  `;

  html += '</div>';
  content.innerHTML = html;

  highlightEdges(nodeId);
}

function highlightEdges(nodeId) {
  document.querySelectorAll('.edge-line').forEach(e => {
    if(e.dataset.from === nodeId || e.dataset.to === nodeId) {
      e.classList.add('highlight');
    } else {
      e.classList.remove('highlight');
    }
  });
}

function unhighlightEdges() {
  if(!selectedNode) {
    document.querySelectorAll('.edge-line').forEach(e => e.classList.remove('highlight'));
  } else {
    highlightEdges(selectedNode);
  }
}

function showTooltip(e, node) {
  const tt = document.getElementById('tooltip');
  const mod = MODULES[node.module];
  tt.innerHTML = `
    <div class="tt-title">${node.label} · ${node.sublabel}</div>
    <div class="tt-meta">${mod.name} · ${node.concepts.length}个知识点</div>
  `;
  tt.classList.add('show');
  moveTooltip(e);
}

function moveTooltip(e) {
  const tt = document.getElementById('tooltip');
  let x = e.clientX + 14;
  let y = e.clientY + 14;
  if(x + 280 > window.innerWidth) x = e.clientX - 280;
  tt.style.left = x + 'px';
  tt.style.top = y + 'px';
}

function hideTooltip() {
  document.getElementById('tooltip').classList.remove('show');
}

// ===== 缩放与平移 =====
let scale = 1, panX = 0, panY = 0;
let isDragging = false, dragStartX = 0, dragStartY = 0;

function updateTransform() {
  gMain.setAttribute('transform', `translate(${panX},${panY}) scale(${scale})`);
}

document.getElementById('graph-container').addEventListener('mousedown', (e) => {
  if(e.target.tagName === 'svg' || e.target === document.getElementById('graph-container')) {
    isDragging = true;
    dragStartX = e.clientX - panX;
    dragStartY = e.clientY - panY;
    document.getElementById('graph-container').classList.add('dragging');
  }
});

document.addEventListener('mousemove', (e) => {
  if(isDragging) {
    panX = e.clientX - dragStartX;
    panY = e.clientY - dragStartY;
    updateTransform();
  }
  const tt = document.getElementById('tooltip');
  if(tt.classList.contains('show')) moveTooltip(e);
});

document.addEventListener('mouseup', () => {
  isDragging = false;
  document.getElementById('graph-container').classList.remove('dragging');
});

// 鼠标滚轮缩放
document.getElementById('graph-container').addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const newScale = Math.max(0.3, Math.min(3, scale * delta));
  // 以鼠标位置为中心缩放
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  panX = mx - (mx - panX) * (newScale / scale);
  panY = my - (my - panY) * (newScale / scale);
  scale = newScale;
  updateTransform();
}, {passive:false});

// 按钮控制
document.getElementById('zoomIn').onclick = () => { scale = Math.min(3, scale * 1.2); updateTransform(); };
document.getElementById('zoomOut').onclick = () => { scale = Math.max(0.3, scale * 0.83); updateTransform(); };
document.getElementById('zoomFit').onclick = () => { scale = 1; panX = 0; panY = 0; updateTransform(); };
document.getElementById('btnReset').onclick = () => {
  scale = 1; panX = 0; panY = 0;
  selectedNode = null;
  document.querySelectorAll('.node-halo').forEach(h => h.setAttribute('opacity','0'));
  unhighlightEdges();
  document.getElementById('sidepanel').classList.remove('open');
  document.getElementById('searchInput').value = '';
  renderNodes();
  updateTransform();
};

document.getElementById('btnLabels').onclick = function() {
  showLabels = !showLabels;
  this.classList.toggle('active', showLabels);
  renderNodes();
};

document.getElementById('btnEdges').onclick = function() {
  showEdges = !showEdges;
  this.classList.toggle('active', showEdges);
  renderEdges();
};

// 搜索
document.getElementById('searchInput').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  if(!q) {
    renderNodes();
    return;
  }
  // 搜索匹配的节点
  const matches = COURSE_DATA.nodes.filter(n =>
    n.label.toLowerCase().includes(q) ||
    n.sublabel.toLowerCase().includes(q) ||
    n.concepts.some(c => c.toLowerCase().includes(q))
  );

  // 高亮匹配的节点，淡化其他
  gNodes.querySelectorAll('g[data-node-id]').forEach(g => {
    const id = g.dataset.nodeId;
    const isMatch = matches.some(m => m.id === id);
    g.style.opacity = isMatch ? '1' : '0.2';
    const circle = g.querySelector('.node-circle');
    if(isMatch) {
      circle.style.filter = 'brightness(1.5) drop-shadow(0 0 8px #7FC873)';
      circle.setAttribute('r','24');
    } else {
      circle.style.filter = '';
      circle.setAttribute('r','20');
    }
  });

  // 同时高亮匹配的边
  gEdges.querySelectorAll('.edge-line').forEach(edge => {
    const fromMatch = matches.some(m => m.id === edge.dataset.from);
    const toMatch = matches.some(m => m.id === edge.dataset.to);
    edge.style.opacity = (fromMatch && toMatch) ? '0.8' : '0.1';
  });
});

// 触摸支持（移动端）
let touchStartX = 0, touchStartY = 0, touchPanX = 0, touchPanY = 0;
document.getElementById('graph-container').addEventListener('touchstart', (e) => {
  if(e.touches.length === 1) {
    touchStartX = e.touches[0].clientX - panX;
    touchStartY = e.touches[0].clientY - panY;
  }
}, {passive:true});

document.getElementById('graph-container').addEventListener('touchmove', (e) => {
  if(e.touches.length === 1) {
    panX = e.touches[0].clientX - touchStartX;
    panY = e.touches[0].clientY - touchStartY;
    updateTransform();
  }
}, {passive:true});

// ===== 初始化 =====
function initApp() {
  try {
    console.log('initApp starting...');
    computeLayout();
    console.log('computeLayout done, positions:', Object.keys(LAYOUT.positions).length);
    initSVG();
    console.log('initSVG done');
    updateTransform();
    console.log('updateTransform done');
    // 默认选中课件1
    setTimeout(() => {
      console.log('selecting c1...');
      selectNode('c1');
    }, 100);
  } catch(e) {
    console.error('initApp error:', e);
    document.getElementById('graph-container').innerHTML = '<div style="padding:40px;color:#7FC873">加载出错: ' + e.message + '</div>';
  }
}

// 确保DOM加载完成
if(document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
</script>
